<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>決戰 2026 預測積分賽</title>
<meta property="og:title" content="決戰 2026 預測積分賽">
<meta property="og:description" content="預測 22 縣市首長勝負，押中積分、搶占排行。不賭錢，只賭眼光。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one battle per screen, war-report cards on lacquer black, sticky progress + fixed bottom command bar */
:root{
  --ink:#100d0b; --lacquer:#1b1613; --lacquer-2:#241d19; --line:#3d3029;
  --fg:#f3ead9; --muted:#b4a48b; --gold:#dcaa4a; --blood:#c2382b;
  --blue:#4a86e8; --blue-bg:#16243d; --green:#33ad6a; --green-bg:#122d20;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 120px;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(194,56,43,.22),transparent 60%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:720px;margin:0 auto}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;color:var(--muted);letter-spacing:.06em}
.bar-row b{color:var(--gold);font-family:var(--display);font-size:15px;letter-spacing:.1em}
.track{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px}
.track i{height:4px;border-radius:2px;background:var(--line)}
.track i.on{background:var(--blood)} .track i.done{background:var(--gold)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.hero{padding-block:48px 24px;text-align:left}
.hero .kicker{color:var(--blood);font-weight:700;letter-spacing:.3em;font-size:13px}
.hero h1{font-size:clamp(52px,14vw,96px);font-weight:900;line-height:1;letter-spacing:.04em;margin-top:10px}
.hero h1 span{color:var(--gold)}
.hero p{color:var(--muted);margin:16px 0 0;max-width:34em}
.panel{background:var(--lacquer);border:1px solid var(--line);border-radius:6px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.countdown{display:flex;gap:10px;flex-wrap:wrap}
.countdown div{flex:1 1 64px;background:var(--lacquer-2);border:1px solid var(--line);border-radius:4px;padding:10px 6px;text-align:center}
.countdown b{display:block;font-family:var(--display);font-size:28px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
.countdown small{color:var(--muted);font-size:12px;letter-spacing:.1em}
label.lbl{display:block;font-size:13px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
input[type=text],input[type=number]{width:100%;font:inherit;font-size:18px;color:var(--fg);background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.note{font-size:13px;color:var(--muted)}
.warn{font-size:14px;color:#f0b4ab;background:rgba(194,56,43,.12);border:1px solid rgba(194,56,43,.5);border-radius:4px;padding:10px 12px}
.sec-title{padding-block:28px 14px;display:flex;flex-direction:column;gap:6px}
.sec-title .tag{align-self:flex-start;font-size:12px;letter-spacing:.2em;color:var(--ink);background:var(--gold);padding:2px 10px;border-radius:2px;font-weight:700}
.sec-title h2{font-size:clamp(32px,8vw,48px);font-weight:900;letter-spacing:.06em}
.sec-title .pts{color:var(--gold);font-family:var(--display);font-size:18px}
.battle{border-left:3px solid var(--blood);padding:4px 0 4px 14px;color:#e4d7c1;font-family:var(--display);font-weight:600;font-size:17px;line-height:1.8}
.battle small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);margin-top:6px}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.vs{align-self:center;font-family:var(--display);font-weight:900;font-size:26px;color:var(--blood)}
.cand{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border:2px solid var(--line);border-radius:6px;background:var(--lacquer);text-align:center;transition:transform .15s,border-color .15s}
.cand:hover{transform:translateY(-2px)}
.cand:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:32px;color:#fff}
.av.blue{background:var(--blue)} .av.green{background:var(--green)}
.cand .nm{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.08em}
.chip{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid}
.chip.blue{color:#a9c6f7;border-color:var(--blue);background:var(--blue-bg)} .chip.green{color:#9fe0bb;border-color:var(--green);background:var(--green-bg)}
.cand.sel.blue{border-color:var(--blue);background:var(--blue-bg);box-shadow:0 0 0 3px rgba(74,134,232,.25)}
.cand.sel.green{border-color:var(--green);background:var(--green-bg);box-shadow:0 0 0 3px rgba(51,173,106,.25)}
.cand.sel::after{content:"押注";font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--gold)}
.grid-c{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.county{background:var(--lacquer);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.county.done{border-color:#5a4a33}
.county-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.county-h h3{font-size:20px;font-weight:900;letter-spacing:.08em}
.inc{font-size:12px;color:var(--muted)} .inc b{font-weight:700}
.inc b.blue{color:#a9c6f7} .inc b.green{color:#9fe0bb}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:4px}
.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.opt .av{width:32px;height:32px;font-size:15px}
.opt .nm{font-weight:700;flex:1}
.opt .pt{font-size:12px;color:var(--muted)}
.opt.sel.blue{background:var(--blue-bg);border-color:var(--blue)} .opt.sel.green{background:var(--green-bg);border-color:var(--green)}
.tiers{display:grid;gap:10px}
.tier{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;background:var(--lacquer);border:1px solid var(--line);border-radius:6px;padding:14px}
.tier .n{font-family:var(--display);font-weight:900;font-size:40px;color:var(--gold);text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.tier .n small{display:block;font-size:12px;color:var(--muted);font-family:var(--body);font-weight:400;margin-top:4px}
.tier h3{font-size:18px} .tier p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.prose p{margin:0 0 12px;max-width:40em}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{all:unset;cursor:pointer;text-align:center;padding:12px;border:1px solid var(--line);border-radius:4px;font-weight:700;background:var(--ink)}
.pill.sel{border-color:var(--gold);color:var(--gold);background:rgba(220,170,74,.1)}
.pill:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:4px;font-size:22px}
.stepper button:focus-visible{outline:2px solid var(--gold)}
.seats{display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.seats div{flex:1 1 120px;border-radius:4px;padding:10px 12px}
.seats .g{background:var(--green-bg);border:1px solid var(--green)} .seats .b{background:var(--blue-bg);border:1px solid var(--blue)}
.seats b{font-family:var(--display);font-size:30px;display:block;line-height:1.1}
.seatbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.seatbar i{display:block;height:100%}
table.sum{width:100%;border-collapse:collapse;font-size:14px}
table.sum td,table.sum th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.sum th{color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.1em}
table.sum td.v{font-weight:700}
.edit{all:unset;cursor:pointer;color:var(--gold);font-size:13px;text-decoration:underline}
.scroll-x{overflow-x:auto}
nav.cmd{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(transparent,var(--ink) 30%);
  padding:22px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.cmd .wrap{display:flex;gap:10px;align-items:center}
.btn{all:unset;cursor:pointer;text-align:center;padding:14px 18px;border-radius:4px;font-weight:700;letter-spacing:.15em;border:1px solid var(--line);background:var(--lacquer)}
.btn.primary{flex:1;background:var(--blood);border-color:var(--blood);color:#fff;font-family:var(--display);font-size:18px}
.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hint{flex-basis:100%;font-size:13px;color:#f0b4ab;text-align:center;min-height:1em}
/* seal */
.sealed{padding-block:40px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.stamp{width:170px;height:170px;border:6px double var(--blood);border-radius:10px;display:grid;place-items:center;color:var(--blood);font-family:var(--display);font-weight:900;font-size:64px;line-height:1;transform:rotate(-8deg);background:rgba(194,56,43,.08)}
.stamp.go{animation:slam .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slam{0%{transform:scale(3) rotate(-25deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-8deg)}}
.sealed h2{font-size:32px;font-weight:900;letter-spacing:.1em}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
.admin{margin-top:40px}
.admin h3{font-size:18px;margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpis div{background:var(--lacquer-2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-variant-numeric:tabular-nums}
.kpis small{display:block;font-size:12px;color:var(--muted)}
.kpis b{font-family:var(--display);font-size:26px;color:var(--gold)}
.kpis span{font-size:12px;color:var(--muted);margin-left:4px}
.tally{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.tl{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;font-size:13px}
.tl-n{color:var(--muted)}
.tl-bar{display:flex;gap:2px;min-width:0;border-radius:3px;overflow:hidden}
.tl-bar i{font-style:normal;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:#fff}
.tl-bar i.blue{background:var(--blue)} .tl-bar i.green{background:var(--green)} .tl-bar i.none{background:var(--line);color:var(--muted)}
.full table.sum{min-width:1800px;font-size:13px}
.full td,.full th{white-space:nowrap}
.full tr>*:first-child{position:sticky;left:0;background:var(--lacquer);z-index:1}
@media (max-width:420px){.duel{grid-template-columns:1fr 1fr}.vs{display:none}.tier{grid-template-columns:60px 1fr}.tier .n{font-size:32px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="bar"><div class="wrap">
  <div class="bar-row"><b id="stepName">入營</b><span id="stepNo">第 1 / 10 關</span></div>
  <div class="track" id="track"></div>
</div></header>

<main class="wrap" id="app"></main>

<nav class="cmd"><div class="wrap" style="flex-wrap:wrap">
  <button class="btn" id="back" type="button">上一關</button>
  <button class="btn primary" id="next" type="button">出征</button>
  <div class="hint" id="hint"></div>
</div></nav>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
// 貼上 Google Apps Script 部署後的網址
const API_URL = "https://script.google.com/macros/s/AKfycbzXu_5Q1u5x9kIznNgfme77xBhtaeZFgsvr_Kc1Ly67kpDfig8tW1wJdeWsDVMv4FeY/exec";
const DEADLINE = new Date("2026-11-27T23:59:00+08:00");
const B = c => c==="民進黨" ? "green" : "blue";

const CORE = {
  taipei:{name:"台北市",pts:"30 分｜當選人 15 ＋ 票差 15",tag:"核心戰場",
    c:[{n:"蔣萬安",p:"國民黨",x:"現任"},{n:"沈伯洋",p:"民進黨"}],
    battle:"首都決戰！蔣萬安苦戰力拚連任，沈伯洋率「洋流」大軍兵臨城下。"},
  ntpc:{name:"新北市",pts:"10 分｜猜中當選人",tag:"激戰區",
    c:[{n:"李四川",p:"國民黨"},{n:"蘇巧慧",p:"民進黨"}],
    battle:"侯友宜交出帥印，李四川接旗出陣；蘇巧慧苦戰九百日直取板橋。兩軍貼身肉搏，誰能入主新北耶誕城？"},
  khh:{name:"高雄市",pts:"10 分｜猜中當選人",tag:"激戰區",
    c:[{n:"柯志恩",p:"國民黨"},{n:"賴瑞隆",p:"民進黨"}],
    battle:"港都烽火再起！柯志恩率奇兵突進，賴瑞隆固守港都。各路戰報落差驚人：有的平手僅差 0.1%，有的相差 20%，戰場迷霧未散，唯有開票見真章。"}
};
const SRC = "戰情依 10/20–11/9 公開民調整理，僅供參考。";

const NORTH = [
 ["基隆市","blue",[["謝國樑","國民黨"],["童子瑋","民進黨"]]],
 ["桃園市","blue",[["張善政","國民黨"],["黃世杰","民進黨"]]],
 ["新竹市","blue",[["高虹安","無黨籍・藍白共推"],["莊競程","民進黨"]]],
 ["新竹縣","blue",[["徐欣瑩","國民黨"],["鄭朝方","民進黨"]]],
 ["苗栗縣","blue",[["鍾東錦","國民黨"],["陳品安","民進黨"]]],
 ["台中市","blue",[["江啟臣","國民黨"],["何欣純","民進黨"]]],
 ["彰化縣","blue",[["魏平政","國民黨"],["陳素月","民進黨"]]],
 ["南投縣","blue",[["許淑華","國民黨"],["温世政","民進黨"]]],
 ["宜蘭縣","blue",[["吳宗憲","國民黨・藍白共推"],["林國漳","民進黨"]]],
 ["花蓮縣","blue",[["游淑貞","國民黨"],["張峻","無黨籍"],["魏嘉賢","無黨籍"]]]
];
const SOUTH = [
 ["雲林縣","blue",[["張嘉郡","國民黨"],["劉建國","民進黨"]]],
 ["嘉義市","blue",[["張啓楷","民眾黨・藍白共推"],["王美惠","民進黨"]]],
 ["嘉義縣","green",[["吳品叡","無黨籍・在野共推"],["蔡易餘","民進黨"]]],
 ["台南市","green",[["謝龍介","國民黨"],["陳亭妃","民進黨"]]],
 ["屏東縣","green",[["蘇清泉","國民黨"],["周春米","民進黨"]]],
 ["台東縣","blue",[["吳秀華","國民黨"],["陳瑩","民進黨"]]],
 ["澎湖縣","green",[["陳振中","國民黨"],["吳淑瑾","民進黨"],["葉竹林","無黨籍"]]],
 ["金門縣","blue",[["陳玉珍","國民黨"],["李文良","無黨籍"]]],
 ["連江縣","blue",[["王忠銘","國民黨"],["曹爾元","無黨籍"]]]
];
const ALL_C = [...NORTH,...SOUTH];
const camp = p => p==="民進黨" ? "green" : "blue";

const STEPS = ["入營","軍令","台北","新北","高雄","北中東","南部離島","加分","點將","封關"];
let step = 0;
let S = {nickname:"",taipei:"",margin:"",ntpc:"",khh:"",counties:{},q1:"",q2:"",q3:null};
let sealedDoc=null, saving=false;
try{const d=JSON.parse(localStorage.getItem("e26sealed")||"null"); if(d){sealedDoc=d; step=9}}catch(e){}

try{const d=JSON.parse(localStorage.getItem("e26draft")||"null"); if(d) S=Object.assign(S,d)}catch(e){}
const saveDraft=()=>{try{localStorage.setItem("e26draft",JSON.stringify(S))}catch(e){}};
const closed=()=>Date.now()>DEADLINE.getTime();
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function myGreen(){
  let g=0;
  if(S.taipei) g+= camp(CORE.taipei.c.find(x=>x.n===S.taipei).p)==="green";
  if(S.ntpc) g+= camp(CORE.ntpc.c.find(x=>x.n===S.ntpc).p)==="green";
  if(S.khh) g+= camp(CORE.khh.c.find(x=>x.n===S.khh).p)==="green";
  ALL_C.forEach(([n,,cs])=>{const v=S.counties[n]; if(v){const c=cs.find(x=>x[0]===v); if(c&&camp(c[1])==="green") g++}});
  return g;
}
function picked(){return ALL_C.filter(([n])=>S.counties[n]).length}

function valid(i){
  switch(i){
    case 0: return S.nickname.trim().length>0 && !closed() ? "" : closed()? "已過截止時間，無法參賽" : "請先填寫暱稱";
    case 2: if(!S.taipei) return "請選擇台北市當選人"; return /^\d+$/.test(String(S.margin)) && +S.margin>0 ? "" : "請填寫預測票差（正整數）";
    case 3: return S.ntpc?"":"請選擇新北市當選人";
    case 4: return S.khh?"":"請選擇高雄市當選人";
    case 5: return NORTH.every(([n])=>S.counties[n])?"":"還有縣市尚未押注";
    case 6: return SOUTH.every(([n])=>S.counties[n])?"":"還有縣市尚未押注";
    case 7: if(!S.q1) return "請回答加分題 1"; if(!/^\d+$/.test(String(S.q2))) return "請填寫加分題 2 的票數"; return S.q3===null?"請確認加分題 3 的席次":"";
    default: return "";
  }
}

function duel(key){
  const d=CORE[key]; const v=S[key];
  return `<div class="duel">${d.c.map((c,i)=>`${i===1?'<div class="vs">VS</div>':''}
    <button type="button" class="cand ${B(c.p)} ${v===c.n?'sel':''}" data-core="${key}" data-v="${c.n}" aria-pressed="${v===c.n}">
      <span class="av ${B(c.p)}">${c.n[0]}</span><span class="nm">${c.n}</span>
      <span class="chip ${B(c.p)}">${c.p}${c.x?'・'+c.x:''}</span></button>`).join("")}</div>`;
}
function coreView(key,extra=""){
  const d=CORE[key];
  return `<div class="sec-title"><span class="tag">${d.tag}</span><h2>${d.name}</h2><span class="pts">${d.pts}</span></div>
  <div class="stack"><div class="battle">${d.battle}<small>${SRC}</small></div>${duel(key)}${extra}</div>`;
}
function countyView(list,title,sub){
  return `<div class="sec-title"><span class="tag">一般選區</span><h2>${title}</h2><span class="pts">每縣市 2 分｜已押注 ${list.filter(([n])=>S.counties[n]).length} / ${list.length}</span></div>
  <p class="note" style="margin:0 0 14px">${sub}</p>
  <div class="grid-c">${list.map(([n,inc,cs])=>`<section class="county ${S.counties[n]?'done':''}">
    <div class="county-h"><h3>${n}</h3><span class="inc">現任 <b class="${inc}">${inc==="green"?"綠營":"藍營"}</b></span></div>
    <div class="opts">${cs.map(([cn,p])=>`<button type="button" class="opt ${camp(p)} ${S.counties[n]===cn?'sel':''}" data-county="${n}" data-v="${cn}" aria-pressed="${S.counties[n]===cn}">
      <span class="av ${camp(p)}">${cn[0]}</span><span class="nm">${cn}</span><span class="pt">${p}</span></button>`).join("")}</div></section>`).join("")}</div>`;
}

function render(){
  document.getElementById("stepName").textContent=STEPS[step];
  document.getElementById("stepNo").textContent=`第 ${step+1} / 10 關`;
  document.getElementById("track").innerHTML=STEPS.map((_,i)=>`<i class="${i<step?'done':i===step?'on':''}"></i>`).join("");
  let h="";
  if(step===0){
    h=`<div class="hero"><div class="kicker">2026 九合一・縣市長</div><h1>決戰<br><span>2026</span></h1>
      <p>預測 22 縣市首長勝負，押中積分、搶占排行。不賭錢，只賭眼光。投票日 11 月 28 日。</p></div>
      <div class="stack">
      <div class="panel stack"><label class="lbl">距離封關（11/27 23:59）</label><div class="countdown" id="cd"></div></div>
      <div class="panel stack"><div><label class="lbl" for="nick">你的暱稱</label>
        <input type="text" id="nick" maxlength="20" placeholder="例如：竹北鐵口直斷" value="${esc(S.nickname)}"></div>
        <p class="note" style="margin:0">每人限送出一次，送出後不得修改。</p>
        <div id="statusBox"></div></div></div>`;
  } else if(step===1){
    h=`<div class="sec-title"><span class="tag">軍令</span><h2>遊戲規則</h2><span class="pts">總分 100 分</span></div>
    <div class="stack">
    <div class="tiers">
      <div class="tier"><div class="n">30<small>分</small></div><div><h3>核心戰場｜台北市</h3><p>猜中當選人 15 分；票差 15 分由猜中當選人者中，票差預測最接近者獨得。</p></div></div>
      <div class="tier"><div class="n">20<small>分</small></div><div><h3>激戰區｜新北、高雄</h3><p>每市猜中當選人 10 分。</p></div></div>
      <div class="tier"><div class="n">38<small>分</small></div><div><h3>一般選區｜其餘 19 縣市</h3><p>每縣市猜中當選人 2 分。</p></div></div>
      <div class="tier"><div class="n">12<small>分</small></div><div><h3>加分題｜3 題</h3><p>每題 4 分，最接近者得分；同分者平分，無條件捨去。</p></div></div>
    </div>
    <div class="panel prose"><h3 style="font-size:20px;margin-bottom:10px">權重怎麼來</h3>
      <p>台北市是全國焦點，同時考驗暴風圈中的我們選情的預判精準性，權重最高。新北、高雄人口龐大且戰況膠著。其餘縣市也影響2028大選風向。加分題讓輸贏更難猜。</p>
      <h3 style="font-size:20px;margin:16px 0 10px">為何這一戰關鍵</h3>
      <p>這是 2024 大選後第一場全國性地方選舉，六都與 16 縣市同日改選，被各界視為 2028 總統大選的前哨戰。多個縣市首長任期屆滿、世代交接，藍白合作首度在地方全面登場，許多縣市戰況空前膠著。</p>
      <p class="note">計分以中央選舉委員會正式公告為準。同分時，台北票差誤差較小者勝。</p></div></div>`;
  } else if(step===2){
    h=coreView("taipei",`<div class="panel"><label class="lbl" for="margin">預測票差：第一名比第二名多幾票？</label>
      <input type="number" id="margin" inputmode="numeric" min="1" step="1" placeholder="例如 35000" value="${esc(S.margin)}">
      <p class="note" style="margin:8px 0 0">參考：2022 年台北市長，第一、二名相差約 25 萬票。</p></div>`);
  } else if(step===3){ h=coreView("ntpc"); }
  else if(step===4){ h=coreView("khh"); }
  else if(step===5){ h=countyView(NORTH,"北中東","基隆、桃竹苗、中彰投、宜花。"); }
  else if(step===6){ h=countyView(SOUTH,"南部・離島","雲嘉南、屏東、台東、澎金馬。"); }
  else if(step===7){
    const g=S.q3===null?myGreen():S.q3; if(S.q3===null) S.q3=g;
    h=`<div class="sec-title"><span class="tag">加分題</span><h2>三小加分題</h2><span class="pts">每題 4 分</span></div>
    <div class="stack">
    <div class="panel stack"><h3 style="font-size:18px">1. 桃園市議員萬寶寶佀廣洋是否當選？</h3>
      <div class="yn"><button type="button" class="pill ${S.q1==='是'?'sel':''}" data-q1="是">當選</button><button type="button" class="pill ${S.q1==='否'?'sel':''}" data-q1="否">落選</button></div></div>
    <div class="panel stack"><h3 style="font-size:18px">2. 新北數字議員得票數</h3>
      <div><label class="lbl" for="q2">預測得票數（最接近者勝）</label><input type="number" id="q2" inputmode="numeric" min="0" step="1" placeholder="例如 18000" value="${esc(S.q2)}"></div></div>
    <div class="panel stack"><h3 style="font-size:18px">3. 22 縣市首長藍綠席次</h3>
      <p class="note" style="margin:0">民進黨以外的當選人（國民黨、民眾黨、無黨籍，如高虹安、鍾東錦、游淑貞、張峻等）一律計入泛藍。依你前面的押注，綠營是 <b style="color:var(--fg)">${myGreen()}</b> 席，可自行調整。</p>
      <div class="stepper"><button type="button" data-seat="-1" aria-label="綠營減一席">−</button>
        <div class="seats" style="flex:1"><div class="g"><small>民進黨</small><b>${g}</b></div><div class="b"><small>泛藍</small><b>${22-g}</b></div></div>
        <button type="button" data-seat="1" aria-label="綠營加一席">＋</button></div>
      <div class="seatbar"><i style="width:${g/22*100}%;background:var(--green)"></i><i style="width:${(22-g)/22*100}%;background:var(--blue)"></i></div></div></div>`;
  } else if(step===8){
    const row=(k,v,go)=>`<tr><th>${k}</th><td class="v">${v||'<span style="color:#f0b4ab">未填</span>'}</td><td><button type="button" class="edit" data-go="${go}">修改</button></td></tr>`;
    h=`<div class="sec-title"><span class="tag">點將</span><h2>確認戰報</h2><span class="pts">${esc(S.nickname)} 的預測</span></div>
    <div class="stack"><div class="panel scroll-x"><table class="sum">
      ${row("台北市",S.taipei,2)}${row("台北票差",S.margin?Number(S.margin).toLocaleString()+" 票":"",2)}
      ${row("新北市",S.ntpc,3)}${row("高雄市",S.khh,4)}
      ${NORTH.map(([n])=>row(n,S.counties[n],5)).join("")}
      ${SOUTH.map(([n])=>row(n,S.counties[n],6)).join("")}
      ${row("加分 1｜佀廣洋",S.q1==="是"?"當選":S.q1==="否"?"落選":"",7)}
      ${row("加分 2｜得票數",S.q2!==""?Number(S.q2).toLocaleString()+" 票":"",7)}
      ${row("加分 3｜席次",S.q3!==null?`綠 ${S.q3}・藍 ${22-S.q3}`:"",7)}
    </table></div><p class="warn">按下「封關送出」後無法再修改。</p></div>`;
  } else if(step===9){
    const d=sealedDoc||S;
    h=`<div class="sealed"><div class="stamp ${sealedDoc&&sealedDoc._fresh?'go':''}">封</div><h2>預測已封存</h2>
      <p class="note">${esc(d.nickname)}，你的戰報已送達主帥營。11 月 28 日開票後揭曉排名。</p></div>
      <div class="panel scroll-x"><table class="sum">
      <tr><th>台北市</th><td class="v">${esc(d.taipei)}・差 ${Number(d.margin).toLocaleString()} 票</td></tr>
      <tr><th>新北市</th><td class="v">${esc(d.ntpc)}</td></tr><tr><th>高雄市</th><td class="v">${esc(d.khh)}</td></tr>
      <tr><th>藍綠席次</th><td class="v">綠 ${d.q3}・藍 ${22-d.q3}</td></tr></table></div>`;
  }
  app.innerHTML=h;
  bind(); renderNav(); window.scrollTo(0,0);
}

function renderNav(){
  const back=document.getElementById("back"), next=document.getElementById("next"), hint=document.getElementById("hint");
  back.hidden = step===0||step===9;
  next.hidden = step===9;
  const err=valid(step);
  let label = step===0?"出征":step===8?"封關送出":"下一關";
  next.textContent = saving?"送出中…":label;
  let block = err;
  if(step===8){ for(let i=0;i<8;i++){const e=valid(i); if(e){block=e;break}} if(!block && closed()) block="已過截止時間"; }
  next.setAttribute("aria-disabled", block||saving ? "true":"false");
  hint.textContent = "";
  next.dataset.err = block||"";
}

function bind(){
  app.querySelectorAll("[data-core]").forEach(b=>b.onclick=()=>{S[b.dataset.core]=b.dataset.v;saveDraft();render()});
  app.querySelectorAll("[data-county]").forEach(b=>b.onclick=()=>{S.counties[b.dataset.county]=b.dataset.v;S.q3=null;saveDraft();const y=window.scrollY;render();window.scrollTo(0,y)});
  app.querySelectorAll("[data-q1]").forEach(b=>b.onclick=()=>{S.q1=b.dataset.q1;saveDraft();const y=window.scrollY;render();window.scrollTo(0,y)});
  app.querySelectorAll("[data-seat]").forEach(b=>b.onclick=()=>{S.q3=Math.max(0,Math.min(22,(S.q3??myGreen())+ +b.dataset.seat));saveDraft();const y=window.scrollY;render();window.scrollTo(0,y)});
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{step=+b.dataset.go;render()});
  const nick=document.getElementById("nick"); if(nick) nick.oninput=()=>{S.nickname=nick.value;saveDraft();renderNav()};
  const m=document.getElementById("margin"); if(m) m.oninput=()=>{S.margin=m.value.trim();saveDraft();renderNav()};
  const q2=document.getElementById("q2"); if(q2) q2.oninput=()=>{S.q2=q2.value.trim();saveDraft();renderNav()};
  if(step===0){tick(); renderStatus()}
  // picks in steps 2-4 that need county reset of q3
  if(step>=2&&step<=4) app.querySelectorAll("[data-core]").forEach(b=>b.addEventListener("click",()=>{S.q3=null}));
}

function renderStatus(){
  const box=document.getElementById("statusBox"); if(!box) return;
  let msg="";
  if(closed()) msg="已封關，停止收件。";
  box.innerHTML = msg?`<p class="warn" style="margin:0">${msg}</p>`:"";
}

function tick(){
  const el=document.getElementById("cd"); if(!el) return;
  let s=Math.max(0,Math.floor((DEADLINE-Date.now())/1000));
  const d=Math.floor(s/86400); s%=86400; const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60;
  el.innerHTML=[[d,"天"],[h,"時"],[m,"分"],[s,"秒"]].map(([v,l])=>`<div><b>${String(v).padStart(2,"0")}</b><small>${l}</small></div>`).join("");
}
setInterval(()=>{if(step===0)tick()},1000);

document.getElementById("back").onclick=()=>{if(step>0){step--;render()}};
document.getElementById("next").onclick=async()=>{
  const next=document.getElementById("next"), hint=document.getElementById("hint");
  if(next.getAttribute("aria-disabled")==="true"){hint.textContent=next.dataset.err||"";return}
  if(step<8){step++;render();return}
  if(closed()){hint.textContent="已過截止時間";return}
  saving=true; renderNav();
  const doc={nickname:S.nickname.trim(),taipei:S.taipei,margin:+S.margin,ntpc:S.ntpc,khh:S.khh,counties:{...S.counties},q1:S.q1,q2:+S.q2,q3:S.q3,submittedAt:new Date().toISOString()};
  try{
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(doc)});
    const out=await res.json();
    if(!out.ok){
      saving=false; renderNav();
      const msg={duplicate:"這個暱稱已經有人用過了，請回第 1 關換一個暱稱。",closed:"已過截止時間，停止收件。",invalid:"資料不完整，請檢查每一關是否都已作答。"}[out.error]||"送出失敗，請稍後再試一次。";
      document.getElementById("hint").textContent=msg; return;
    }
    sealedDoc={...doc,_fresh:true}; step=9; saving=false;
    try{localStorage.removeItem("e26draft"); localStorage.setItem("e26sealed",JSON.stringify(doc))}catch(e){}
    render(); burst();
  }catch(e){
    saving=false; renderNav();
    document.getElementById("hint").textContent="送出失敗，請檢查網路後再試一次。";
  }
};

// confetti
function burst(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.getElementById("fx"),x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#dcaa4a","#c2382b","#f3ead9","#4a86e8","#33ad6a"];
  const P=Array.from({length:160},()=>({x:c.width/2,y:c.height*.35,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,r:Math.random()*6+3,c:cols[Math.random()*5|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++t<160)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}

render();
</script>
</body>
</html>
